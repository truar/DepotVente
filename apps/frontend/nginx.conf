server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy backend API routes
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /signin {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /protected {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /logout {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /push {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cache headers. Note there are no server-level add_header directives: nginx
    # only inherits add_header into a location that declares none of its own, so
    # adding one at server level later would silently drop these four.

    # The service worker script must never come from a stale HTTP cache.
    # Browsers already bypass it (updateViaCache defaults to 'imports'), but be
    # explicit — a stale sw.js means clients never see a new build.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
        access_log off;
    }

    # index.html carries the hashed asset URLs, so it must revalidate on every
    # load (cheap 304 via ETag). "no-cache" means store it but always revalidate.
    # The try_files fallback below is an internal redirect, which re-runs
    # location matching — so SPA deep links land here too.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        default_type application/manifest+json;
    }

    # Content-hashed build output: safe to pin forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # SPA fallback - serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
